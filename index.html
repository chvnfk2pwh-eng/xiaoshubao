const b=x=>Uint8Array.from(atob(x),ch=>ch.charCodeAt(0));
async function open_(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.s),iterations:P.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.i)},k,b(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close()}
const f=document.getElementById("f"),err=document.getElementById("err");
(async()=>{let saved=null;try{saved=localStorage.getItem("xsb-pw")}catch(e){}
  if(saved){try{show(await open_(saved));return}catch(e){try{localStorage.removeItem("xsb-pw")}catch(_){}}}
  f.hidden=false;document.getElementById("pw").focus()})();
f.onsubmit=async e=>{e.preventDefault();const pw=document.getElementById("pw").value;err.textContent="正在打开…";
  try{const h=await open_(pw);try{localStorage.setItem("xsb-pw",pw)}catch(_){}show(h)}catch(_){err.textContent="密码不对，再试一次"}};
</script></body></html>
