<style>
/* Layout: one centered column like a page of a 作业本; one task per screen, big tap targets for small fingers */
:root{
  --bg:#EAF3EE; --paper:#FFFFFF; --ink:#1F3B33; --muted:#5B756C; --line:#CFE0D7;
  --accent:#EE7A26; --accent-ink:#FFFFFF; --grid:#DE5B54;
  --good:#2B9657; --bad:#D4473A; --good-bg:#E0F3E6; --bad-bg:#FBE5E2;
  --math:#3A7BCF; --yu:#D4534C; --en:#8857C6; --star:#F2B21B;
  --f-round:"Fredoka","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-kai:"KaiTi","STKaiti","Kaiti SC","楷体","AR PL UKai CN",serif;
  --f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12201B; --paper:#1B2C27; --ink:#E5F0EB; --muted:#9BB3AA; --line:#2D453E;
  --accent:#F49448; --accent-ink:#1A1410; --grid:#E8817A;
  --good:#5CC88A; --bad:#F2796C; --good-bg:#1D3A2A; --bad-bg:#43221E;
  --math:#6EA3E6; --yu:#E8817A; --en:#B08AE4; --star:#F5C445; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12201B; --paper:#1B2C27; --ink:#E5F0EB; --muted:#9BB3AA; --line:#2D453E;
  --accent:#F49448; --accent-ink:#1A1410; --grid:#E8817A;
  --good:#5CC88A; --bad:#F2796C; --good-bg:#1D3A2A; --bad-bg:#43221E;
  --math:#6EA3E6; --yu:#E8817A; --en:#B08AE4; --star:#F5C445; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-block:14px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{margin:0;text-wrap:balance}
h1{font-family:var(--f-round);font-size:30px;font-weight:700}
h2{font-size:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.top h2{min-width:0;text-align:center}
.back{white-space:nowrap;flex-shrink:0;font-size:17px;padding:10px 14px;border-radius:12px;background:var(--paper);border:2px solid var(--line);min-height:48px}
.stars{font-family:var(--f-round);font-weight:600;font-size:20px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.stars b{color:var(--star);font-size:24px}
.muted{color:var(--muted)}
.small{font-size:14px}
.note{background:var(--paper);border:2px dashed var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note p{margin:0;min-width:0;flex:1 1 220px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .glyph{font-size:44px;line-height:1;font-weight:700;height:52px;display:flex;align-items:center}
.tile .t{font-size:21px;font-weight:700}
.tile .s{font-size:14px;color:var(--muted)}
.g-math{color:var(--math);font-family:var(--f-round)}
.g-yu{color:var(--yu);font-family:var(--f-kai)}
.g-en{color:var(--en);font-family:var(--f-round)}
.g-wr{color:var(--accent);font-family:var(--f-round)}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px 16px;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;font-size:19px;font-weight:600}
.row span:last-child{font-weight:400;font-size:15px;color:var(--muted);white-space:nowrap}
.btn{min-height:58px;padding:10px 20px;border-radius:18px;font-size:20px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line)}
.btn.good{background:var(--good);color:var(--paper)}
.btn.bad{background:var(--paper);color:var(--bad);border:2px solid var(--bad)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.stage{background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;transition:background .2s,border-color .2s}
.stage.ok{background:var(--good-bg);border-color:var(--good)}
.stage.no{background:var(--bad-bg);border-color:var(--bad)}
.expr{font-family:var(--f-round);font-weight:600;font-size:clamp(44px,12vw,72px);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:.25em;flex-wrap:wrap;justify-content:center}
.ans{min-width:1.6em;padding:0 .15em;border-bottom:5px solid var(--accent);text-align:center;color:var(--accent);min-height:1.2em}
.fix{font-size:20px;font-weight:700;color:var(--bad);min-height:30px}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.keypad button{min-height:64px;border-radius:16px;background:var(--paper);border:2px solid var(--line);font-family:var(--f-round);font-size:30px;font-weight:600}
.keypad button:active{background:var(--line)}
.keypad .ok{background:var(--good);color:var(--paper);border-color:var(--good)}
/* 田字格 */

<script>
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';

/* ---------- original word pictures (viewBox 0 0 100 100) ---------- */
const PIC=(function(){
const O="#3B2F2A",SK="#FFD9B8",SK2="#F2C29A";
const st=`stroke="${O}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"`;
function eyes(cx,cy,r,o){o=o||{};const dx=r*.36,ey=cy-r*.05;
  let s=o.closed?`<path d="M${cx-dx-3} ${ey}q3 2.5 6 0M${cx+dx-3} ${ey}q3 2.5 6 0" fill="none" ${st}/>`
   :`<circle cx="${cx-dx}" cy="${ey}" r="${r*.1}" fill="${O}"/><circle cx="${cx+dx}" cy="${ey}" r="${r*.1}" fill="${O}"/>`;

  else if(m==="open")s+=`<path d="M${cx-r*.3} ${cy+r*.25}q${r*.3} ${r*.5} ${r*.6} 0z" fill="#C0392B" ${st}/>`;
  else if(m==="o")s+=`<ellipse cx="${cx}" cy="${cy+r*.38}" rx="${r*.12}" ry="${r*.16}" fill="#C0392B" ${st}/>`;

function head(cx,cy,r,o){o=o||{};const h=o.hair||"#4A3426",sk=o.skin||SK;let s="";

  if(hs==="pony")s+=`<ellipse cx="${cx+r*1.05}" cy="${cy+r*.2}" rx="${r*.3}" ry="${r*.55}" fill="${h}" ${st}/>`;
  if(hs==="bun")s+=`<circle cx="${cx}" cy="${cy-r*1.05}" r="${r*.38}" fill="${h}" ${st}/>`;
  s+=`<circle cx="${cx-r}" cy="${cy+r*.05}" r="${r*.2}" fill="${sk}" ${st}/><circle cx="${cx+r}" cy="${cy+r*.05}" r="${r*.2}" fill="${sk}" ${st}/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${sk}" ${st}/>`;
  if(hs==="bald")s+=`<path d="M${cx-r*.95} ${cy-r*.1}q-${r*.1}-${r*.5} ${r*.25}-${r*.55}M${cx+r*.95} ${cy-r*.1}q${r*.1}-${r*.5}-${r*.25}-${r*.55}" fill="none" stroke="${h}" stroke-width="${r*.25}" stroke-linecap="round"/>`;
  else if(hs==="bun"||hs==="grey")s+=`<path d="M${cx-r} ${cy-r*.05}q0-${r*1.05} ${r}-${r*1.02}q${r} 0 ${r} ${r*1.02}q-${r*.5}-${r*.55}-${r}-${r*.5}q-${r*.5}-${r*.05}-${r} ${r*.5}z" fill="${h}" ${st}/>`;
  else s+=`<path d="M${cx-r*1.02} ${cy+r*.05}q-${r*.05}-${r*1.1} ${r*1.02}-${r*1.08}q${r*1.05} 0 ${r*1.02} ${r*1.08}q-${r*.3}-${r*.55}-${r*.75}-${r*.6}q-${r*.35} ${r*.35}-${r*1.2} ${r*.3}q-${r*.1}-${r*.1}-${r*.1}-${r*.1}z" fill="${h}" ${st}/>`;

}
/* person: cx = centre, ft = feet y, h = total height */
function person(cx,ft,h,o){o=o||{};const r=h*.2,hy=ft-h+r,by=hy+r*.95,bh=h*.36,bw=h*.32,lg=ft-(by+bh);
  const sh=o.shirt||"#4A90D9",pt=o.pants||"#2F4E7A",sk=o.skin||SK;let s="";
  const arm=(side,mode)=>{const sx=cx+side*bw*.5,sy=by+bh*.2;let ex,ey;
    if(mode==="up"){ex=sx+side*h*.12;ey=sy-h*.3}else if(mode==="wave"){ex=sx+side*h*.18;ey=sy-h*.22}
    else if(mode==="out"){ex=sx+side*h*.24;ey=sy+h*.04}else if(mode==="fwd"){ex=sx+side*h*.22;ey=sy+h*.1}
    else if(mode==="in"){ex=cx+side*bw*.1;ey=sy+bh*.55}else{ex=sx+side*h*.06;ey=sy+bh*.75}
    return `<path d="M${sx} ${sy}L${ex} ${ey}" stroke="${O}" stroke-width="${h*.1+2.2}" stroke-linecap="round"/><path d="M${sx} ${sy}L${ex} ${ey}" stroke="${sh}" stroke-width="${h*.1}" stroke-linecap="round"/><circle cx="${ex}" cy="${ey}" r="${h*.055}" fill="${sk}" ${st}/>`};
  s+=`<path d="M${cx-bw*.25} ${by+bh-2}v${lg}M${cx+bw*.25} ${by+bh-2}v${lg}" stroke="${O}" stroke-width="${h*.09+2.2}" stroke-linecap="round"/><path d="M${cx-bw*.25} ${by+bh-2}v${lg}M${cx+bw*.25} ${by+bh-2}v${lg}" stroke="${pt}" stroke-width="${h*.09}" stroke-linecap="round"/>`;

const heart=(x,y,s,c)=>`<path d="M${x} ${y+9*s}C${x-14*s} ${y} ${x-10*s} ${y-12*s} ${x} ${y-5*s}C${x+10*s} ${y-12*s} ${x+14*s} ${y} ${x} ${y+9*s}z" fill="${c||"#F05D6C"}" ${st}/>`;
const star=(x,y,r,c)=>{let p="";for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;p+=(i?"L":"M")+(x+rr*Math.cos(a)).toFixed(1)+" "+(y+rr*Math.sin(a)).toFixed(1)}return `<path d="${p}z" fill="${c||"#FFC93C"}" ${st}/>`};

function flat(strokes){const p=[];strokes.forEach((s,id)=>s.forEach(q=>p.push({x:q[0],y:q[1],id})));return p}
function pathLen(p){let d=0;for(let i=1;i<p.length;i++)if(p[i].id===p[i-1].id)d+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);return d}
function resample(pts,n){

  const I=len/(n-1),p=pts.map(q=>({...q})),out=[{...p[0]}];let D=0;
  for(let i=1;i<p.length;i++){if(p[i].id!==p[i-1].id)continue;
    const d=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);
    if(D+d>=I&&d>0){const t=(I-D)/d,q={x:p[i-1].x+t*(p[i].x-p[i-1].x),y:p[i-1].y+t*(p[i].y-p[i-1].y),id:p[i].id};out.push(q);p.splice(i,0,q);D=0}else D+=d}

}

  const s=Math.max(x1-x0,y1-y0)||1;let cx=0,cy=0;const q=pts.map(p=>({x:(p.x-x0)/s,y:(p.y-y0)/s,id:p.id}));
  q.forEach(p=>{cx+=p.x;cy+=p.y});cx/=q.length;cy/=q.length;return q.map(p=>({x:p.x-cx,y:p.y-cy,id:p.id}));
}
const prep=strokes=>norm(resample(flat(strokes),N));
function cloudDist(a,b,start){const m=new Array(N).fill(false);let sum=0,i=start;
  do{let best=1e9,bj=-1;for(let j=0;j<N;j++)if(!m[j]){const d=(a[i].x-b[j].x)**2+(a[i].y-b[j].y)**2;if(d<best){best=d;bj=j}}
    m[bj]=true;sum+=(1-((i-start+N)%N)/N)*Math.sqrt(best);i=(i+1)%N}while(i!==start);return sum}

/* score every template against what the child wrote; strokes = [[[x,y],...],...] in box-height units */
function rank(strokes){
  const ink=strokes.filter(s=>s.length),pts=prep(ink),vb=vbox(ink);const best={};
  TPL.forEach(t=>{const d=match(pts,t.pts)+LAMBDA*(Math.abs(vb[0]-t.vb[0])+Math.abs(vb[1]-t.vb[1]));if(!(t.ch in best)||d<best[t.ch])best[t.ch]=d});
  return Object.entries(best).sort((a,b)=>a[1]-b[1]);
}
/* lenient check: accept when the target letter scores nearly as well as the best letter */
let RATIO=1.3;
function check(strokes,target){
  const ink=strokes.filter(s=>s.length);if(!ink.length)return {ok:false,guess:"",empty:true};
  const r=rank(ink),tg=target.toLowerCase(),best=r[0][1],mine=(r.find(x=>x[0]===tg)||[0,1e9])[1];

function pickVoice(lg){

  if(!vs.length)return null;
  const norm=v=>(v.lang||"").replace("_","-").toLowerCase();

  let best=null;

    best=c.find(v=>/premium|enhanced|natural|neural|高/i.test(v.name))||c.find(v=>/samantha|ava|allison|zoe|google us|aria|jenny|ting-ting|tingting|yaoyao|xiaoxiao/i.test(v.name))||c.find(v=>v.localService)||c[0];break}}

}

function enParts(t){
  t=t.trim();if(SAY[t])return [[SAY[t],"en-US"]];
  const re=new RegExp("\\b("+Object.keys(NAMES).join("|")+")\\b","g"),out=[];let last=0,m;
  while((m=re.exec(t))){if(m.index>last)out.push([t.slice(last,m.index),"en-US"]);out.push([NAMES[m[1]],"zh-CN"]);last=m.index+m[0].length}

function oneMath(l){
  let a,b,op;
  if(l==="5"||l==="10"){const M=+l;if(Math.random()<.5){op="+";a=rnd(0,M-1);b=rnd(1,M-a)}else{op="−";a=rnd(1,M);b=rnd(0,a)}}
  else if(l==="20"){if(Math.random()<.5){op="+";const o=rnd(0,8);a=10+o;b=rnd(1,9-o)}else{op="−";const o=rnd(1,9);a=10+o;b=rnd(1,o)}}
  else{op="+";a=rnd(2,9);b=rnd(Math.max(2,11-a),9)}
  return {a,op,b,ans:op==="+"?a+b:a-b};
}
function genMath(l,n){const out=[],seen=new Set();let t=0;while(out.length<n&&t<300){t++;const q=oneMath(l),k=q.a+q.op+q.b;if(seen.has(k)&&t<200)continue;seen.add(k);out.push(q)}return out}

  }else if(q.kind==="spell"&&spellCfg.mode==="offline"){
    const ph=q.phase,w=it[0],res=q.res,show=q.hint||ph!=="write";

      <div class="btns" style="justify-content:center">${hasTTS?`<button class="say" data-act="say">${SPK}听单词</button>`:""}${ph==="write"?`<button class="say" data-act="hint">${q.hint?"收起提示":"提示"}</button>`:""}</div>
      ${show||!hasTTS?`<div class="hintbox">${pic(it[1],"mini2")}<span class="cn">${esc(it[2]||"")}</span></div>`:""}
      ${ph!=="write"?`<div class="answer">${esc(w)}</div>`:""}
      <div class="lboxes">${w.split("").map((c,i)=>`<div class="lbox${res?(res[i].ok?" ok":" no"):""}"><canvas class="lpad" data-i="${i}" aria-label="第${i+1}个字母"></canvas>${res&&!res[i].ok?`<span class="fixl">${esc(c)}</span>`:""}</div>`).join("")}</div>
      <div class="spell-msg">${msg}</div></div>`;
    h+=ph==="write"?`<div class="btns"><button class="btn ghost" data-act="undo">撤销一笔</button><button class="btn ghost" data-act="padclear">全部擦掉</button><button class="btn good" data-act="check">写好了 ✓</button></div>`
      :ph==="right"?`<div class="btns"><button class="btn" data-act="spellnext">下一个</button></div>`
      :`<div class="btns"><button class="btn ghost" data-act="spellagain">改一改</button><button class="btn" data-act="spellnext">下一个</button></div>`;
  }else if(q.kind==="spell"){
    const ph=q.phase,show=q.hint||ph!=="write"&&ph!=="checking";
    const msg={write:hasTTS?"听一听，在格子里写出这个单词。":"看中文，在格子里写出这个英语单词。",checking:"正在看你写的……",
      right:"写对了！",wrong:`${q.read?`我看到你写的是 <b>${esc(q.read)}</b>。`:""}${esc(q.tip||"再仔细看看字母。")}`,
      self:`${q.note?esc(q.note)+"<br>":""}对一对：和你写的一样吗？`}[ph];
    h+=`<div class="stage ${ph==="right"?"ok":ph==="wrong"?"no":""}">
      <div class="btns" style="justify-content:center">${hasTTS?`<button class="say" data-act="say">${SPK}听单词</button>`:""}${ph==="write"?`<button class="say" data-act="hint">${q.hint?"收起提示":"提示"}</button>`:""}</div>
      ${show||!hasTTS?`<div class="hintbox">${pic(it[1],"mini2")}<span class="cn">${esc(it[2]||"")}</span></div>`:""}
      ${ph==="right"||ph==="wrong"||ph==="self"?`<div class="answer">${esc(it[0])}</div>`:""}
      <div class="pad${ph==="write"?"":" done"}"><canvas id="pad" aria-label="手写区"></canvas></div>
      <div class="spell-msg">${msg}</div></div>`;
    h+=ph==="write"?`<div class="btns"><button class="btn ghost" data-act="padclear">擦掉</button><button class="btn good" data-act="check">写好了 ✓</button></div>`
      :ph==="checking"?`<div class="btns"><button class="btn ghost" disabled>批改中…</button></div>`
      :ph==="right"?`<div class="btns"><button class="btn" data-act="spellnext">下一个</button></div>`
      :ph==="wrong"?`<div class="btns"><button class="btn ghost" data-act="spellagain">再写一次</button><button class="btn" data-act="spellnext">下一个</button></div>`
      :`<div class="btns"><button class="btn bad" data-act="selfmark" data-arg="0">写错了</button><button class="btn good" data-act="selfmark" data-arg="1">写对了 ✓</button></div>`;
  }else{
    const yu=q.subj==="yuwen";
    h+=`<div class="stage ${q.mark}">${hasTTS?`<button class="say" data-act="say">${SPK}再听一遍</button><div class="muted">${yu?"听一听，是哪个字？":"Listen! 是哪个？"}</div>`
        :`<div class="py">${esc(yu?it[1]:it[2])}</div><div class="muted">是哪个？</div>`}
      <div class="opts">${q.opts.map((o,i)=>{const cls=q.picked<0?"":(o[0]===it[0]?"right":(i===q.picked?"wrong":""));
        return `<button class="opt ${cls}" data-act="pick" data-arg="${i}">`+(yu?`<div class="tzg sm"><span>${esc(o[0])}</span></div>`
          :(o[1]?pic(o[1],"opt-pic"):`<span class="w">${esc(o[0])}</span>`)+(o[2]?`<span class="opt-cn">${esc(o[2])}</span>`:""))+`</button>`}).join("")}</div></div>`;
  }
  return h;
},

function runFrom(f){
  const L=f.idx==="all"?null:data[f.subj][f.idx];
  if(f.kind==="sents"){const items=L?(L.sents||[]):data[f.subj].flatMap(x=>x.sents||[]);const ok=startQuiz(f.subj,"cards",items);if(ok)quiz.sent=true,render();return ok}
  return startQuiz(f.subj,f.kind,L?L.items:allItems(f.subj));
}
function serialize(subj){
  return data[subj].map(l=>"# "+l.name+"\n"+l.items.map(it=>it.join(" | ")).concat((l.sents||[]).map(it=>"> "+it.join(" | "))).join("\n")).join("\n\n");
}
function parse(text,subj){
  const out=[];let cur=null;
  text.split(/\r?\n/).forEach(raw=>{const line=raw.trim();if(!line)return;
    if(/^[#＃]/.test(line)){cur={name:line.replace(/^[#＃]\s*/,"")||"第"+(out.length+1)+"课",items:[],sents:[]};out.push(cur);return}
    if(!cur){cur={name:"第1课",items:[],sents:[]};out.push(cur)}
    const isSent=/^[>＞]/.test(line);if(isSent){const ps=line.replace(/^[>＞]\s*/,"").split(/[|｜]/).map(s=>s.trim());cur.sents.push([ps[0],ps[1]||"",ps[2]||""]);return}
    let parts=line.split(/[|｜]/).map(s=>s.trim());
    if(parts.length===1&&subj==="yuwen")parts=line.split(/\s+/);
    if(subj==="yuwen")cur.items.push([parts[0],parts[1]||""]);
    else cur.items.push([parts[0],parts[1]||"",parts[2]||""]);
  });
  return out.filter(l=>l.items.length||l.sents.length);
}

const STRICT={loose:1.45,normal:1.3,strict:1.15};
let spellCfg=Object.assign({mode:"offline",strict:"normal"},S.get("xsb-spell",{}));
const inClaude=!!(window.claude&&window.claude.use);if(!inClaude)spellCfg.mode="offline";
LETTERS.setRatio(STRICT[spellCfg.strict]||1.3);
const LBOX_ASPECT=0.8;
function initLBoxes(){
  const q=quiz,w=q.items[q.i][0];if(q.lst.length!==w.length)q.lst=w.split("").map(()=>[]);
  document.querySelectorAll(".lpad").forEach(c=>{
    const i=+c.dataset.i,r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;
    c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);const g=c.getContext("2d");g.scale(d,d);
    g.lineCap=g.lineJoin="round";g.lineWidth=Math.max(3.5,r.height/16);g.strokeStyle=getComputedStyle(c).color;
    const draw=()=>{g.clearRect(0,0,r.width,r.height);q.lst[i].forEach(s=>{g.beginPath();s.forEach((p,k)=>k?g.lineTo(p[0]*r.width,p[1]*r.height):g.moveTo(p[0]*r.width,p[1]*r.height));if(s.length===1)g.lineTo(s[0][0]*r.width+.5,s[0][1]*r.height+.5);g.stroke()})};draw();
    if(q.phase!=="write")return;
    let cur=null;const pt=e=>{const b=c.getBoundingClientRect();return[Math.min(1,Math.max(0,(e.clientX-b.left)/b.width)),Math.min(1,Math.max(0,(e.clientY-b.top)/b.height))]};
    c.onpointerdown=e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}cur=[pt(e)];q.lst[i].push(cur);q.undo.push(i);draw()};
    c.onpointermove=e=>{if(!cur)return;e.preventDefault();cur.push(pt(e));draw()};
    c.onpointerup=c.onpointercancel=()=>{cur=null};
  });
}
function checkOffline(){
  const q=quiz,it=q.items[q.i],w=it[0];
  if(!q.lst.some(s=>s.length)){toast("先在格子里写一写");return}
  q.res=w.split("").map((ch,i)=>LETTERS.check((q.lst[i]||[]).map(s=>s.map(p=>[p[0]*LBOX_ASPECT,p[1]])),ch));
  if(q.res.every(r=>r.ok)){if(!q.tried)q.score++;q.phase="right";chime(true)}
  else{q.tried=true;q.phase="wrong";addWrong("english",it);chime(false)}
  render();setTimeout(()=>speak(w,"en-US",true),300);
}
function spellable(w){return /^[A-Za-z]{1,12}$/.test(w)}
let sampleFn=null;
(async()=>{try{if(window.claude&&window.claude.use){const s=await window.claude.use("sample");if(s){const lim=await s.limits().catch(()=>null);if(lim&&lim.images)sampleFn=s}}}catch(e){}})();
function padSize(){const c=document.getElementById("pad");return c?c.getBoundingClientRect():{width:600,height:180}}
function strokeAll(g,W,H){quiz.strokes.forEach(s=>{g.beginPath();s.forEach((p,i)=>i?g.lineTo(p[0]*W,p[1]*H):g.moveTo(p[0]*W,p[1]*H));if(s.length===1)g.lineTo(s[0][0]*W+.5,s[0][1]*H+.5);g.stroke()})}
function initPad(){
  const c=document.getElementById("pad");if(!c)return;const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;
  c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);const g=c.getContext("2d");g.scale(d,d);
  g.lineCap=g.lineJoin="round";g.lineWidth=Math.max(4,r.height/26);g.strokeStyle=getComputedStyle(c).color;
  const draw=()=>{g.clearRect(0,0,r.width,r.height);strokeAll(g,r.width,r.height)};draw();
  if(quiz.phase!=="write")return;
  let cur=null;const pt=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)/b.width,(e.clientY-b.top)/b.height]};
  c.onpointerdown=e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}cur=[pt(e)];quiz.strokes.push(cur);draw()};
  c.onpointermove=e=>{if(!cur)return;e.preventDefault();cur.push(pt(e));draw()};
  c.onpointerup=c.onpointercancel=()=>{cur=null};
}
function padBlob(){
  const r=padSize(),W=1000,H=Math.round(1000*r.height/r.width),o=document.createElement("canvas");o.width=W;o.height=H;
  const g=o.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,W,H);g.lineCap=g.lineJoin="round";g.lineWidth=Math.max(8,H/26);g.strokeStyle="#111";strokeAll(g,W,H);
  const url=o.toDataURL("image/png"),b=atob(url.split(",")[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
  return new Blob([a],{type:"image/png"});
}
function render(){
  const fn=V[view.name]||V.home;app.innerHTML=fn();window.scrollTo(0,0);
  if(view.name==="quiz"&&quiz&&quiz.kind==="spell")(spellCfg.mode==="offline"?initLBoxes():initPad());
}

const A={
  go(arg){quiz=arg==="home"?null:quiz;view={name:arg};render()},
  math(l){quiz&&(quiz.level=l);startQuiz("math","math",genMath(l,10));quiz.level=l},
  lesson(arg){const [subj,idx]=arg.split("|");view={name:"mode",subj,idx};render()},
  mode(kind){const {subj,idx}=view;const f={subj,idx,kind};const ok=runFrom(f);if(ok)quiz.from=f},
  key(k){if(quiz.locked)return;if(quiz.input.length<2){quiz.input=(quiz.input==="0"?"":quiz.input)+k;render()}},
  del(){if(quiz.locked)return;quiz.input=quiz.input.slice(0,-1);render()},
  ok(){
    const q=quiz,it=q.items[q.i];if(q.locked||q.input==="")return;q.locked=true;
    if(+q.input===it.ans){q.score++;q.mark="ok";chime(true);if(q.review)delWrong("math",it);render();setTimeout(nextQ,700)}
    else{q.mark="no";chime(false);addWrong("math",it);render();setTimeout(nextQ,1800)}
  },
  card(v){const q=quiz,it=q.items[q.i];if(v==="1"){q.score++;if(q.review)delWrong(q.subj,it)}else addWrong(q.subj,it);nextQ()},
  py(){quiz.showPy=!quiz.showPy;render()},
  say(){sayCurrent(0,true)},
  hint(){quiz.hint=!quiz.hint;render()},
  padclear(){quiz.strokes=[];quiz.lst=[];quiz.undo=[];render()},
  undo(){const q=quiz,i=q.undo.pop();if(i!==undefined&&q.lst[i])q.lst[i].pop();render()},
  setspell(v){spellCfg.mode=v;S.set("xsb-spell",spellCfg);render()},
  setstrict(v){spellCfg.strict=v;S.set("xsb-spell",spellCfg);LETTERS.setRatio(STRICT[v]);render()},
  spellagain(){if(spellCfg.mode==="offline"){const q=quiz;q.lst=q.lst.map((s,i)=>q.res&&q.res[i]&&q.res[i].ok?s:[]);q.undo=[];q.res=null;q.phase="write";render();sayCurrent(200,true);return}
    quiz.strokes=[];quiz.phase="write";quiz.read="";quiz.tip="";render();sayCurrent(200,true)},
  spellnext(){nextQ()},
  selfmark(v){const q=quiz,it=q.items[q.i];if(v==="1"){if(!q.tried)q.score++;q.phase="right";chime(true)}else{q.tried=true;addWrong("english",it);chime(false);q.strokes=[];q.phase="write";q.hint=true}render()},
  async check(){
    const q=quiz,it=q.items[q.i];if(q.phase!=="write")return;
    if(spellCfg.mode==="offline"){checkOffline();return}
    if(!q.strokes.length){toast("先在格子里写一写");return}
    if(!sampleFn){q.phase="self";render();return}
    q.phase="checking";render();
    try{
      const res=await sampleFn.json(`The image shows one English word handwritten by a 6-year-old Chinese first-grader (dark ink on white; the writing lines were removed). The child was asked to write the word "${it[0]}". Read the letters the child actually wrote, left to right. Be tolerant of wobbly, oversized, unevenly spaced or slightly misshapen letters, and ignore upper/lower case. But a missing, extra, swapped or clearly different letter makes it wrong. Reply with only JSON: {"read": "<the letters you see>", "correct": true or false, "tip": "<if wrong: one short, kind sentence in simple Chinese for a child saying which letter to fix; if correct: empty string>"}`,
        {images:padBlob(),modelTier:"quick",cache:false});
      if(quiz!==q||q.items[q.i]!==it)return;
      q.read=String(res&&res.read||"").slice(0,30);q.tip=String(res&&res.tip||"").slice(0,80);
      if(res&&res.correct===true){if(!q.tried)q.score++;q.phase="right";chime(true)}
      else{q.tried=true;q.phase="wrong";addWrong("english",it);chime(false)}
      render();setTimeout(()=>speak(it[0],"en-US",true),300);
    }catch(e){
      if(quiz!==q)return;const c=e&&e.code;
      if(["not_granted","sampling_disabled","images_unavailable","not_declared","capability_disabled","capability_removed","session_expired"].includes(c))sampleFn=null;
      q.note=c==="rate_limited"?"批改的次数有点多，先自己对一对答案吧。":"这次没能自动批改，请自己对一对答案。";
      q.phase="self";render();
    }
  },
  tts(arg){const i=arg.indexOf("|");speak(arg.slice(i+1),arg.slice(0,i)==="zh"?"zh-CN":"en-US");
    const b=lastBtn;if(b&&b.classList){document.querySelectorAll(".speaking").forEach(x=>x.classList.remove("speaking"));b.classList.add("speaking");setTimeout(()=>b.classList.remove("speaking"),1200)}},
  pick(i){
    const q=quiz,it=q.items[q.i];if(q.locked)return;q.locked=true;q.picked=+i;
    if(q.opts[i][0]===it[0]){q.score++;q.mark="ok";chime(true);if(q.review)delWrong(q.subj,it);render();setTimeout(nextQ,800)}
    else{q.mark="no";chime(false);addWrong(q.subj,it);render();setTimeout(()=>{sayCurrent(0,true)},300);setTimeout(nextQ,2600)}
  },
  again(){const q=quiz;
    if(q.review){A.wstart(q.subj);return}
    if(q.subj==="math")startQuiz("math","math",genMath(q.level,10)),quiz.level=q.level;
    else{const f=q.from;if(runFrom(f))quiz.from=f}},
  wtab(t){view={name:"wrong",tab:t};render()},
  wstart(t){t=t||view.tab||"math";const list=wrong[t].slice();
    if(t==="math")startQuiz("math","math",list.map(x=>({...x})),true);
    else startQuiz(t,t==="english"?"cards":"listen",list,true)},
  save(){
    const yu=parse(document.getElementById("ta-yu").value,"yuwen"),en=parse(document.getElementById("ta-en").value,"english");
    data={yuDemo:data.yuDemo&&document.getElementById("ta-yu").value===serialize("yuwen"),enVer:3,yuwen:yu,english:en};S.set("xsb-data",data);toast("已保存");
  },
  reset(){if(!view.confirmReset){view.confirmReset=true;render();return}data=JSON.parse(JSON.stringify(DEFAULT));S.set("xsb-data",data);view={name:"parent"};render();toast("已恢复默认内容")},
  clearwrong(){if(!view.confirmClear){view.confirmClear=true;render();return}wrong={math:[],yuwen:[],english:[]};S.set("xsb-wrong",wrong);view={name:"parent"};render();toast("错题本已清空")}
};
let lastBtn=null;
app.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;lastBtn=b;const f=A[b.dataset.act];if(f)f(b.dataset.arg)});
document.addEventListener("keydown",e=>{if(view.name!=="quiz"||!quiz||quiz.kind!=="math"||e.target.tagName==="TEXTAREA")return;
  if(/^[0-9]$/.test(e.key))A.key(e.key);else if(e.key==="Backspace")A.del();else if(e.key==="Enter")A.ok()});
if(hasTTS){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}
render();
</script>
</body></html>
